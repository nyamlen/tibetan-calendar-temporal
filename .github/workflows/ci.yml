name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # TypeScript 7 ships no compiler of its own — it resolves a platform-specific
      # optionalDependency. Never pass --omit=optional here or tsc will be missing.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
