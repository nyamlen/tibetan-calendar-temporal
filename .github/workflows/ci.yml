name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # TypeScript 7 ships no compiler of its own — it resolves a platform-specific
      # optionalDependency. Never pass --omit=optional here or tsc will be missing.
      - run: npm ci

      - run: npm run lint
      - run: npm run lint:md

      # The rules lint, typecheck and the suite cannot see: the zero-dependency claim, the
      # integer-only arithmetic, coded errors, {@link} targets, the decision-record format,
      # fixture provenance, and whether docs/coding-standards.md still names real commands.
      # Each of those fails silently rather than loudly, which is why it needs its own gate.
      - run: npm run check:links
      - run: npm run check:conventions

      # Nothing above proves the checker still *reports*: a rule that stops firing prints "All
      # conventions hold", which looks exactly like success. This breaks each convention in a
      # scratch copy of the tree and asserts the checker says so. Kept out of `npm test`, whose
      # subject is the engine; run on every push so a mutation whose target text has moved is
      # caught the same day.
      - run: npm run test:conventions

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Everything above imports from `src/`, so nothing above can see a broken `exports` map, a
      # file missing from `files`, or a `dist/` layout that does not match what `exports` points
      # at. Those fail only for a consumer, after publishing. These two close that gap: publint and
      # attw check the manifest statically, and test:pack proves the packed tarball actually runs.
      - run: npm run check:publish
      - run: npm run test:pack
