name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The full CI matrix on the tagged commit. Required checks are not enforced on `main`, so a tag
  # could otherwise point at a commit CI never passed.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # With trusted publishing anyone who can push a `v*` tag can publish; the environment's required
    # reviewer is what stops that. npm's trusted-publisher entry names this environment too.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No cache in the publishing job: a poisoned cache entry would reach the tarball.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: The tag names the version in package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on origin/main"
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1; fail here rather than with an auth error.
      # An npm without `stage` answers an unknown command with exit code 0, so test the help text.
      - name: npm has staged publishing
        run: |
          if ! npm stage publish --help 2>&1 | grep -q "Stage a package for publishing"; then
            echo "npm $(npm --version) has no 'npm stage publish'"
            exit 1
          fi

      - run: npm ci

      # Staged, not direct: the trusted publisher allows only `npm stage publish`, so the version
      # reaches the registry only when the maintainer approves it on npm with their passkey.
      # `prepack` builds dist/. Provenance is generated automatically under trusted publishing.
      - run: npm stage publish
